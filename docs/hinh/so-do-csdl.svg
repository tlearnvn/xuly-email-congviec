  <text x="1045" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#5b32bd">NHÓM VẬN HÀNH</text>

  <rect x="862" y="132" width="366" height="86" rx="10" fill="#ffffff" stroke="#7748e6" stroke-width="2"/>
  <rect x="862" y="132" width="366" height="26" rx="10" fill="#7748e6"/>
  <rect x="862" y="148" width="366" height="10" fill="#7748e6"/>
  <text x="876" y="150" font-family="Consolas, Menlo, monospace" font-size="12.5" font-weight="700" fill="#ffffff">cau_hinh</text>
  <text x="1216" y="150" text-anchor="end" font-size="10.5" fill="#e2d6ff">39 khoá cài đặt</text>
  <text x="876" y="176" font-family="Consolas, Menlo, monospace" font-size="11" fill="#18213a">khoa · gia_tri · nhom · mo_ta</text>
  <text x="876" y="196" font-size="11" fill="#5a6884">Tên ứng dụng, bản quyền, ngưỡng tin cậy,</text>
  <text x="876" y="212" font-size="11" fill="#5a6884">thiết lập AI, quy tắc chống trùng…</text>

  <rect x="862" y="232" width="366" height="86" rx="10" fill="#ffffff" stroke="#7748e6" stroke-width="2"/>
  <rect x="862" y="232" width="366" height="26" rx="10" fill="#7748e6"/>
  <rect x="862" y="248" width="366" height="10" fill="#7748e6"/>
  <text x="876" y="250" font-family="Consolas, Menlo, monospace" font-size="12.5" font-weight="700" fill="#ffffff">nhat_ky</text>
  <text x="1216" y="250" text-anchor="end" font-size="10.5" fill="#e2d6ff">ghi mọi việc đã làm</text>
  <text x="876" y="276" font-family="Consolas, Menlo, monospace" font-size="11" fill="#18213a">id · thoi_gian · muc · nguon</text>
  <text x="876" y="294" font-family="Consolas, Menlo, monospace" font-size="11" fill="#18213a">hanh_dong · noi_dung · dia_chi_ip</text>
  <text x="876" y="312" font-family="Consolas, Menlo, monospace" font-size="11" fill="#18213a">doi_tuong · id_doi_tuong · id_nguoi</text>

  <rect x="862" y="332" width="366" height="66" rx="10" fill="#ffffff" stroke="#a98cf0" stroke-width="1.6"/>
  <text x="876" y="354" font-family="Consolas, Menlo, monospace" font-size="12" font-weight="700" fill="#5b32bd">phien_dong_bo</text>
  <text x="876" y="374" font-size="11" fill="#5a6884">Mỗi lần bấm “Đồng bộ”: bắt đầu, kết thúc,</text>
  <text x="876" y="390" font-size="11" fill="#5a6884">số thư đọc, số việc tạo, số lỗi.</text>

  <rect x="862" y="412" width="366" height="58" rx="10" fill="#ffffff" stroke="#a98cf0" stroke-width="1.6"/>
  <text x="876" y="434" font-family="Consolas, Menlo, monospace" font-size="12" font-weight="700" fill="#5b32bd">tai_len_tam</text>
  <text x="876" y="456" font-size="11" fill="#5a6884">Khối tạm khi tải tệp lớn qua API PHP.</text>

  <rect x="862" y="484" width="366" height="58" rx="10" fill="#ffffff" stroke="#a98cf0" stroke-width="1.6"/>
  <text x="876" y="506" font-family="Consolas, Menlo, monospace" font-size="12" font-weight="700" fill="#5b32bd">phien_ghi_nho</text>
  <text x="876" y="528" font-size="11" fill="#5a6884">Cookie “ghi nhớ đăng nhập trên máy này”.</text>

  <rect x="862" y="556" width="366" height="82" rx="10" fill="#ffffff" stroke="#e3e8f1" stroke-width="1.6"/>
  <text x="876" y="578" font-size="12.5" font-weight="700" fill="#18213a">Quy ước chung của mọi bảng</text>
  <text x="876" y="600" font-size="11" fill="#5a6884">• Bảng mã utf8mb4 — tiếng Việt có dấu đầy đủ</text>
  <text x="876" y="618" font-size="11" fill="#5a6884">• Mốc thời gian lưu theo giờ Việt Nam (GMT+7)</text>
  <text x="876" y="632" font-size="11" fill="#5a6884">• Chạy được trên MySQL 5.7+ và MariaDB 10.3+</text>

