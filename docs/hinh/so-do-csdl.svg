  <!-- ================= Chú thích dưới ================= -->
  <rect x="30" y="672" width="1220" height="200" rx="14" fill="#ffffff" stroke="#e3e8f1"/>
  <text x="54" y="702" font-size="14" font-weight="700" fill="#18213a">Ba mối quan hệ quan trọng nhất</text>

  <rect x="54" y="716" width="380" height="140" rx="10" fill="#eef3ff" stroke="#dae4fb"/>
  <text x="74" y="742" font-size="12.5" font-weight="700" fill="#1443ab">1 · Một thư sinh ra một hoặc nhiều việc</text>
  <text x="74" y="766" font-family="Consolas, Menlo, monospace" font-size="11" fill="#18213a">email 1 —— n cong_viec</text>
  <text x="74" y="790" font-size="11.5" fill="#5a6884">Một mail kèm ba tệp của ba trường khác nhau</text>
  <text x="74" y="808" font-size="11.5" fill="#5a6884">sẽ sinh ra ba việc riêng, ba người xử lý riêng.</text>
  <text x="74" y="834" font-size="11.5" fill="#5a6884">Việc nào cũng trỏ ngược về đúng bức thư gốc.</text>

  <rect x="450" y="716" width="380" height="140" rx="10" fill="#e7f7ee" stroke="#c7ecd8"/>
  <text x="470" y="742" font-size="12.5" font-weight="700" fill="#0a6b3c">2 · Tệp giống nhau chỉ lưu một bản</text>
  <text x="470" y="766" font-family="Consolas, Menlo, monospace" font-size="11" fill="#18213a">tep_dinh_kem n —— 1 tep_du_lieu</text>
  <text x="470" y="790" font-size="11.5" fill="#5a6884">Khoá <tspan font-family="Consolas, Menlo, monospace">hash_tep</tspan> là UNIQUE. Tệp mới trùng nội</text>
  <text x="470" y="808" font-size="11.5" fill="#5a6884">dung chỉ làm <tspan font-family="Consolas, Menlo, monospace">so_tham_chieu</tspan> tăng thêm 1.</text>
  <text x="470" y="834" font-size="11.5" fill="#5a6884">Tiết kiệm rất nhiều dung lượng hosting.</text>

  <rect x="846" y="716" width="380" height="140" rx="10" fill="#fdf3e3" stroke="#f6dfb9"/>
  <text x="866" y="742" font-size="12.5" font-weight="700" fill="#8e560b">3 · Danh mục văn bản được nới lỏng</text>
  <text x="866" y="766" font-family="Consolas, Menlo, monospace" font-size="11" fill="#18213a">cong_viec.id_van_ban → van_ban.id</text>
  <text x="866" y="790" font-size="11.5" fill="#5a6884">Gặp mã lạ, hệ thống tự tạo dòng mới với cờ</text>
  <text x="866" y="808" font-size="11.5" fill="#5a6884"><tspan font-family="Consolas, Menlo, monospace">tu_dong_them = 1</tspan> để việc vẫn hiện và vẫn</text>
  <text x="866" y="834" font-size="11.5" fill="#5a6884">được đếm; quản trị đặt tên chính thức sau.</text>
</svg>
