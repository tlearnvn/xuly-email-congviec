; =====================================================================
;  HE THONG PHAN LUONG MAIL CONG VU - BO NHAN MAIL (MailRouter)
;  Thiet ke boi Truong Anh Tuan
;  ---------------------------------------------------------------------
;  Doi ten tep nay thanh "mailrouter.ini" va dat canh tep thuc thi.
;  Moi thiet lap deu co the sua truc tiep tren bang dieu khien do hoa.
;  Cac muc de trong se lay theo cau hinh luu tren may chu (bang cau_hinh).
; =====================================================================

[luu_tru]
; mysql = ket noi thang toi MySQL/MariaDB (can mo Remote MySQL cho IP may nay)
; api   = day du lieu qua tep api/ingest.php tren hosting (khong can mo cong MySQL)
che_do = mysql

[mysql]
may_chu = localhost
cong = 3306
nguoi_dung =
mat_khau =
co_so_du_lieu =
timeout = 30
; Kich thuoc moi khoi ghi BLOB (KB). Giam xuong neu may chu co max_allowed_packet nho.
kich_thuoc_khoi_kb = 256

[api]
; Vi du: https://tenmien.vn/phanluong/api/ingest.php
url =
; Lay trong muc Cai dat cua trang web quan tri (khoa API)
khoa =
timeout = 120
kich_thuoc_khoi_kb = 512

[gmail]
; Tao trong Google Cloud Console > APIs & Services > Credentials
client_id =
client_secret =
; Neu da co san token thi dien thang vao day
access_token =
refresh_token =
token_het_han = 0
hop_thu =
; De trong = lay theo cau hinh tren may chu
truy_van =
so_mail_moi_lan =

[ai]
; De trong = lay theo cau hinh tren may chu (trang Cai dat cua web)
bat =
url =
api_key =
model =
max_tokens =
timeout =
temperature =
nguong_tin_cay =

[ung_dung]
; 127.0.0.1 = chi may nay truy cap duoc. Dung 0.0.0.0 de mo cho may khac trong mang.
dia_chi_giao_dien = 127.0.0.1
cong_giao_dien = 8899
; Bat buoc nhap khoa khi truy cap tu may khac (de trong = khong yeu cau)
mat_khau_giao_dien =
tu_mo_trinh_duyet = 1
tu_bat_dich_vu = 0
chu_ky_phut = 15
; debug | info | canh_bao | loi
muc_nhat_ky = info
thu_muc_nhat_ky = nhat_ky
dung_luong_tep_toi_da_mb = 25
